# Netlify hosts the advisor console only (static files, synthetic demo data).
# The Python API runs elsewhere (render.yaml); point the console at it with VITE_API_URL.
# Deploys are driven by .github/workflows/deploy.yml after CI passes. If you link the repo in
# the Netlify UI instead, this file configures that build too.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Set in Netlify → Site configuration → Environment variables (not here):
  #   VITE_API_URL = https://<your-api>.onrender.com   (leave unset for the offline demo)

# Client-side routes (TanStack Router) all serve the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
