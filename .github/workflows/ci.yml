name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks reads PR commits

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: |
          uv export --locked --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Accessibility audit (axe, light + dark)
        run: |
          npx playwright install --with-deps chromium
          npm run build:preview
          npm run audit:a11y

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only broker guard
        run: python3 scripts/check_no_order_apis.py

  sast:
    # Static security analysis. Replaces CodeQL, which needs paid Advanced Security on private repos.
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/secrets --config p/dockerfile --error --metrics=off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
