[project]
name = "aicfo"
version = "0.1.0"
description = "AI CFO: portfolio intelligence for Indian wealth professionals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.18",
    "cryptography>=50.0.2",
    "email-validator>=2.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-groq>=1.1",
    "langgraph>=1.2.15",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "snowballstemmer>=3.1.1",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Real dense embeddings (BAAI/bge-small-en-v1.5, ONNX on CPU). CI uses the hashing embedder.
models = ["fastembed>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicfo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "S101",
    "E501",    # line length is handled by the formatter
    "RUF001",  # ₹, ×, − and Σ are intentional in user-facing finance text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aicfo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["snowballstemmer", "fastembed", "langchain_groq", "langchain_google_genai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]
